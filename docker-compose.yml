services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: devknowledge
      POSTGRES_PASSWORD: devknowledge
      POSTGRES_DB: devknowledge
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devknowledge -d devknowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command:
      [
        "sh",
        "-c",
        "npx prisma migrate deploy && node dist/seed.js && exec node dist/server.js",
      ]
    environment:
      PORT: 5001
      DATABASE_URL: postgresql://devknowledge:devknowledge@db:5432/devknowledge
      JWT_SECRET: secret-de-demonstration-a-ne-pas-utiliser-en-production
      CLIENT_URL: http://localhost:8080
      EMAIL_FROM: demo@devknowledge.local
      BREVO_API_KEY: ""
      DEMO_EMAIL: demo@example.com
      DEMO_ADMIN_EMAIL: admin@example.com
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-ministral-8b-2512}
      AI_ASSISTANT_MODEL: ${AI_ASSISTANT_MODEL:-ministral-14b-2512}
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5001
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
